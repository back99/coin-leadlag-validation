<svg viewBox="0 0 960 710" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK KR, sans-serif">
  <rect x="0" y="0" width="960" height="710" fill="#ffffff"/>
  <style>
    .lbl{fill:#1b2333; font-size:14.5px; font-weight:700;}
    .sub{fill:#5a6478; font-size:11px; font-weight:500;}
    .band{fill:#5a6478; font-size:13px; font-weight:700;}
    .flow{fill:#5a6478; font-size:10.5px; font-weight:600;}
    .foot{fill:#5a6478; font-size:11.5px; font-weight:600;}
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#8a93a6"/>
    </marker>
    <marker id="arac" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#2f6fed"/>
    </marker>
  </defs>

  <!-- Band 1 -->
  <rect x="20" y="55" width="920" height="250" rx="16" fill="#f6f8fb" stroke="#d3d8e0" stroke-width="1.4"/>
  <text class="band" x="40" y="83">① 선정 층 — 하루 2번, 느림 (LLM)</text>

  <rect x="42" y="110" width="180" height="62" rx="12" fill="#f5f6f8" stroke="#d3d8e0" stroke-width="1.5"/>
  <text class="lbl" x="132" y="136" text-anchor="middle">오전 7시</text>
  <text class="sub" x="132" y="156" text-anchor="middle">미국 밤사이 뉴스</text>

  <rect x="42" y="200" width="180" height="62" rx="12" fill="#f5f6f8" stroke="#d3d8e0" stroke-width="1.5"/>
  <text class="lbl" x="132" y="226" text-anchor="middle">저녁 7시</text>
  <text class="sub" x="132" y="246" text-anchor="middle">아시아 뉴스</text>

  <rect x="280" y="145" width="160" height="82" rx="12" fill="#e7efff" stroke="#9cbcff" stroke-width="1.8"/>
  <text class="lbl" x="360" y="181" text-anchor="middle">LLM 분석</text>
  <text class="sub" x="360" y="201" text-anchor="middle">Lambda 예약 실행</text>

  <rect x="500" y="135" width="205" height="102" rx="12" fill="#e7efff" stroke="#9cbcff" stroke-width="1.8"/>
  <text class="lbl" x="602" y="168" text-anchor="middle">세션 명단</text>
  <text class="sub" x="602" y="191" text-anchor="middle">알트 후보 + 리더 짝</text>
  <text class="sub" x="602" y="211" text-anchor="middle">방향 편향</text>

  <rect x="765" y="155" width="150" height="76" rx="12" fill="#f5f6f8" stroke="#d3d8e0" stroke-width="1.5"/>
  <text class="lbl" x="840" y="188" text-anchor="middle">DynamoDB</text>
  <text class="sub" x="840" y="208" text-anchor="middle">명단 저장</text>

  <path d="M222,141 L276,172" fill="none" stroke="#8a93a6" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M222,231 L276,200" fill="none" stroke="#8a93a6" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M440,186 L496,186" fill="none" stroke="#8a93a6" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M705,186 L761,190" fill="none" stroke="#8a93a6" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Band 2 -->
  <rect x="20" y="345" width="920" height="300" rx="16" fill="#f6f8fb" stroke="#d3d8e0" stroke-width="1.4"/>
  <text class="band" x="40" y="373">② 실행 층 — 매 틱, 빠름 (코드, LLM 없음)</text>

  <rect x="42" y="455" width="160" height="82" rx="12" fill="#e7efff" stroke="#9cbcff" stroke-width="1.8"/>
  <text class="lbl" x="122" y="490" text-anchor="middle">리더 감시</text>
  <text class="sub" x="122" y="510" text-anchor="middle">BTC, ETH 시세</text>

  <rect x="238" y="455" width="150" height="82" rx="12" fill="#e7efff" stroke="#9cbcff" stroke-width="1.8"/>
  <text class="lbl" x="313" y="490" text-anchor="middle">리더 급등?</text>
  <text class="sub" x="313" y="510" text-anchor="middle">임계치 초과</text>

  <rect x="424" y="455" width="175" height="82" rx="12" fill="#e7efff" stroke="#9cbcff" stroke-width="1.8"/>
  <text class="lbl" x="511" y="490" text-anchor="middle">알트 갭 확인</text>
  <text class="sub" x="511" y="510" text-anchor="middle">아직 안 따라옴?</text>

  <rect x="635" y="455" width="120" height="82" rx="12" fill="#e7efff" stroke="#9cbcff" stroke-width="1.8"/>
  <text class="lbl" x="695" y="490" text-anchor="middle">진입</text>
  <text class="sub" x="695" y="510" text-anchor="middle">매수</text>

  <rect x="785" y="455" width="145" height="82" rx="12" fill="#e7efff" stroke="#9cbcff" stroke-width="1.8"/>
  <text class="lbl" x="857" y="485" text-anchor="middle">청산</text>
  <text class="sub" x="857" y="505" text-anchor="middle">익절/손절/시간</text>

  <path d="M202,496 L234,496" fill="none" stroke="#2f6fed" stroke-width="2" marker-end="url(#arac)"/>
  <path d="M388,496 L420,496" fill="none" stroke="#2f6fed" stroke-width="2" marker-end="url(#arac)"/>
  <path d="M599,496 L631,496" fill="none" stroke="#2f6fed" stroke-width="2" marker-end="url(#arac)"/>
  <path d="M755,496 L781,496" fill="none" stroke="#2f6fed" stroke-width="2" marker-end="url(#arac)"/>

  <!-- feed from Dynamo to execution -->
  <path d="M840,231 C840,340 620,360 515,451" fill="none" stroke="#8a93a6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text class="flow" x="712" y="360" text-anchor="middle">후보 알트 + 리더 참고</text>

  <!-- footer -->
  <text class="foot" x="40" y="682">세션 07–19시: 한국 세션 (미국 뉴스 → 한국 알트)  /  19–07시: 미국 세션 (아시아 뉴스 → 미국 알트)</text>
</svg>
